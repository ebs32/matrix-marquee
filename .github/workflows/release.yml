# Build the firmware for a version tag and publish it as a GitHub release,
# with a checksum file and a build provenance attestation. The release notes
# come from the annotated tag's message.
#
#   git tag -a v1.0.0 -F notes.txt
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation
      attestations: write # store the attestation
      checks: read        # confirm CI passed on the tagged commit
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check the tag is on main

      # A published release can't be replaced, so refuse tags on commits
      # that aren't on main or that haven't passed CI.
      - name: Check the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that isn't on main"
            exit 1
          fi
          ci="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=build" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")][0] | (.conclusion // .status // "missing")')"
          if [ "$ci" != success ]; then
            echo "::error::CI build on $GITHUB_SHA is '$ci', not success"
            exit 1
          fi

      - name: Build
        run: tools/avr make

      - name: Package
        run: |
          mkdir dist
          cp main.hex "dist/matrix-marquee-$TAG-atmega328p.hex"
          cd dist
          sha256sum -- *.hex > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.hex

      # Read the notes through the API: the checkout doesn't keep the
      # annotated tag's message. A lightweight tag has no message and
      # fails here. A signed tag's message ends with its signature, which
      # is cut off.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .message |
            sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
