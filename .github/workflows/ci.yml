# Build the firmware and check formatting with the same toolchain image that
# tools/avr uses locally.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          tools/avr make 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::The build produced warnings"
            exit 1
          fi

      - name: Size
        run: tools/avr make size

      - name: Check formatting
        run: tools/avr clang-format --dry-run --Werror src/*.c src/*.h
